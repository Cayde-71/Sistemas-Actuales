services:
  servidor:
    image: img-servidor
    build: ./Calculadora
    container_name: mi_servidor
    ports:
      - "5050:5050"
    networks:
      - net-service

  cliente:
    image: img_cliente
    build: ./Cliente
    container_name: mi_cliente
    networks:
      - net-service

networks:
  net-service:
    driver: bridge