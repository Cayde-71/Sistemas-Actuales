services:
  servidor:
    image: img-servidor
    build: ./Entregable1/Calculadora
    container_name: mi_servidor
    ports:
      - "5088"
    networks:
      - net-service

  cliente:
    image: img_cliente
    build: ./Entregable1/Cliente
    container_name: mi_cliente
    networks:
      - net-service

networks:
  net-service:
    driver: bridge